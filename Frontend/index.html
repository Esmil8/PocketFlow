<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketFlow — Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◧</span>
      <div>
        <h1>PocketFlow</h1>
        <p class="brand-sub">Módulo de gastos</p>
      </div>
    </div>
  </header>

  <main class="content">

    <section class="toolbar">
      <div class="field">
        <label for="filter-categoria">Categoría</label>
        <select id="filter-categoria">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="toolbar-spacer"></div>
      <button id="btn-new" class="btn btn-primary">
        <span aria-hidden="true">+</span> Nuevo gasto
      </button>
    </section>

    <section class="ledger-wrap">
      <div class="ledger-scroll">
        <table class="ledger" id="expenses-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Categoría</th>
              <th>Descripción</th>
              <th class="col-amount">Monto</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="expenses-body">
          </tbody>
        </table>

        <div id="empty-state" class="empty-state hidden">
          <p>No hay gastos registrados todavía.</p>
          <button class="btn btn-ghost" id="btn-empty-new">Registrar el primero</button>
        </div>

        <div id="loading-state" class="loading-state hidden">
          <p>Cargando gastos…</p>
        </div>

        <div id="error-state" class="error-state hidden">
          <p id="error-message">No se pudo conectar con la API.</p>
          <button class="btn btn-ghost" id="btn-retry">Reintentar</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- Modal: create / edit expense -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">Nuevo gasto</h2>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
    </div>

    <form id="expense-form" novalidate>
      <input type="hidden" id="expense-id">

      <div class="form-row">
        <label for="input-monto">Monto</label>
        <div class="input-amount">
          <span class="currency">$</span>
          <input type="number" id="input-monto" step="0.01" min="0.01" max="999999.99" placeholder="0.00" required>
        </div>
        <span class="field-error" id="err-monto"></span>
      </div>

      <div class="form-row">
        <label for="input-categoria">Categoría</label>
        <select id="input-categoria" required></select>
        <span class="field-error" id="err-categoria"></span>
      </div>

      <div class="form-row">
        <label for="input-fecha">Fecha</label>
        <input type="date" id="input-fecha" required>
        <span class="field-error" id="err-fecha"></span>
      </div>

      <div class="form-row">
        <label for="input-descripcion">Descripción <span class="optional">(opcional)</span></label>
        <textarea id="input-descripcion" rows="2" maxlength="200" placeholder="Ej. Almuerzo con el equipo"></textarea>
        <span class="field-error" id="err-descripcion"></span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay hidden" id="confirm-overlay">
  <div class="modal modal-small" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Eliminar gasto</h2>
    <p class="confirm-text">¿Seguro que quieres eliminar <strong id="confirm-target"></strong>? Esta acción no se puede deshacer.</p>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="btn-confirm-cancel">Cancelar</button>
      <button type="button" class="btn btn-danger" id="btn-confirm-delete">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
